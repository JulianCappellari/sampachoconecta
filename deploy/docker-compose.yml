# Sampacho Conecta — despliegue con Docker (app + HTTPS automático con Caddy)
# Uso: ver docs/DESPLIEGUE_ORACLE.md
services:
  app:
    build:
      context: ../web
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SAMPACHO_DATA_DIR: /data
    volumes:
      - ./data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Comandos de mantenimiento (no se inicia solo):
  #   docker compose run --rm tools npm run seed -- --allow-production
  #   docker compose run --rm tools npm run create-admin -- --email=... --name="..."
  tools:
    profiles: ["tools"]
    build:
      context: ../web
      target: tools
    user: "1000:1000"
    env_file: .env
    environment:
      NODE_ENV: production
      SAMPACHO_DATA_DIR: /data
    volumes:
      - ./data:/data

volumes:
  caddy_data:
  caddy_config:
